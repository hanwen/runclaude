<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>runclaude session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title">
      <span class="dot" id="status-dot" title="connecting"></span>
      <strong>runclaude</strong>
      <span class="session" id="session">connecting…</span>
    </div>
    <div class="who">
      <span id="control" class="me"></span>
      <span id="me" class="me"></span>
      <button id="source-toggle" title="Show jj show @ for the session checkout">Source</button>
      <button id="take" hidden>Take control</button>
      <button id="release" hidden>Release</button>
      <span id="role" class="badge">read-only</span>
    </div>
  </header>

  <div id="body">
    <main id="transcript" aria-live="polite"></main>
    <aside id="source" hidden>
      <div class="source-head">source · <code>jj show @</code></div>
      <pre id="source-body">loading…</pre>
    </aside>
  </div>

  <footer id="composer">
    <textarea id="prompt" rows="1" placeholder="Take control to send a prompt…" disabled></textarea>
    <button id="stop" disabled title="Stop the running turn">Stop</button>
    <button id="send" disabled>Send</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
