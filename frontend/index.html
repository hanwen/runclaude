<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>runclaude session</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="xterm.css">
</head>
<body>
  <header>
    <div class="title">
      <span class="dot" id="status-dot" title="connecting"></span>
      <strong>runclaude</strong>
      <span class="session" id="session">connecting…</span>
      <button id="copy-session" class="ghost" hidden title="Copy session id (use with --serve-resume)">copy id</button>
    </div>
    <div class="who">
      <span id="control" class="me"></span>
      <span id="me" class="me"></span>
      <span id="role" class="badge">read-only</span>
    </div>
  </header>

  <div id="body">
    <main id="transcript" aria-live="polite"></main>
    <aside id="source" hidden>
      <div class="source-head">
        <span class="source-title">source ·
          <select id="source-view" title="Which view of the checkout">
            <option value="show">working copy (jj show @)</option>
            <option value="diff">diff vs trunk</option>
            <option value="log">log</option>
            <option value="files">files</option>
          </select>
        </span>
        <button id="source-expand" class="ghost" title="Maximize / restore the source panel">⤢ expand</button>
      </div>
      <div id="source-body">loading…</div>
    </aside>
    <aside id="terminal" hidden>
      <div class="source-head">
        <span class="source-title">terminal</span>
        <span class="term-head-btns">
          <button id="terminal-popout" class="ghost" title="Pop the presenter view out into its own window">⮺ pop out</button>
          <button id="terminal-expand" class="ghost" title="Maximize / restore the terminal panel">⤢ expand</button>
        </span>
      </div>
      <div class="term-stack">
        <div class="term-pane">
          <div class="term-label">presenter <span class="term-sub">— the controller's shell (read-only)</span></div>
          <div id="term-presenter" class="xterm-host"></div>
        </div>
        <div class="term-pane" id="myshell-pane" hidden>
          <div class="term-label">my shell <span class="term-sub">— private to you, sandboxed</span>
            <span id="docked-presenting" class="presenting-badge" hidden>● presenting</span>
          </div>
          <div id="term-mine" class="xterm-host"></div>
        </div>
      </div>
    </aside>
  </div>

  <footer id="composer">
    <textarea id="prompt" rows="1" placeholder="Take control to send a prompt…" disabled></textarea>
    <button id="take" hidden>Take control</button>
    <button id="send" hidden disabled>Send</button>
    <button id="stop" hidden disabled title="Stop the running turn">Stop</button>
    <button id="release" hidden>Release</button>
    <span class="composer-sep"></span>
    <button id="source-toggle" class="toggle" aria-pressed="false" title="Toggle the source panel (jj show @)">Source</button>
    <button id="terminal-toggle" class="toggle" aria-pressed="false" hidden title="Toggle the terminal panel">Terminal</button>
  </footer>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="term.js"></script>
  <script src="app.js"></script>
</body>
</html>
