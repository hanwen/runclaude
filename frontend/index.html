<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>runclaude session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title">
      <span class="dot" id="status-dot" title="connecting"></span>
      <strong>runclaude</strong>
      <span class="session" id="session">connecting…</span>
      <button id="copy-session" class="ghost" hidden title="Copy session id (use with --serve-resume)">copy id</button>
    </div>
    <div class="who">
      <span id="control" class="me"></span>
      <span id="me" class="me"></span>
      <button id="source-toggle" title="Show jj show @ for the session checkout">Source</button>
      <button id="take" hidden>Take control</button>
      <button id="release" hidden>Release</button>
      <span id="role" class="badge">read-only</span>
    </div>
  </header>

  <div id="body">
    <main id="transcript" aria-live="polite"></main>
    <aside id="source" hidden>
      <div class="source-head">
        <span class="source-title">source ·
          <select id="source-view" title="Which view of the checkout">
            <option value="show">working copy (jj show @)</option>
            <option value="diff">diff vs trunk</option>
            <option value="log">log</option>
            <option value="files">files</option>
          </select>
        </span>
        <button id="source-expand" class="ghost" title="Maximize / restore the source panel">⤢ expand</button>
      </div>
      <div id="source-body">loading…</div>
    </aside>
  </div>

  <footer id="composer">
    <textarea id="prompt" rows="1" placeholder="Take control to send a prompt…" disabled></textarea>
    <button id="stop" disabled title="Stop the running turn">Stop</button>
    <button id="send" disabled>Send</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
